apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-v2
  template:
    metadata:
      labels:
        app: payment-v2
    spec:
      containers:
        - name: payment
          image: priyaranjans27/payment-system:v2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: payment-v2-svc
spec:
  type: NodePort
  selector:
    app: payment-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30002